name: Build PrinceMaster VST3

on:
  push:
    paths:
      - 'PrinceMaster/**'
      - '.github/workflows/build-princemaster.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PrinceMaster
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target PrinceMaster_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: PrinceMaster-VST3-Windows
          path: PrinceMaster/build/PrinceMaster_artefacts/Release/VST3/
