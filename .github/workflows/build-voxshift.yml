name: Build VoxShift (Windows VST3)

on:
  push:
    paths:
      - 'PitchShift/**'
      - '.github/workflows/build-voxshift.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S PitchShift -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target VoxShift_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: VoxShift-VST3-Windows
          path: build/VoxShift_artefacts/Release/VST3/
