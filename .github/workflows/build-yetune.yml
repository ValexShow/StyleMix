name: Build YeTune (Windows VST3)

on:
  push:
    paths:
      - 'YeTune/**'
      - '.github/workflows/build-yetune.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S YeTune -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target YeTune_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: YeTune-VST3-Windows
          path: build/YeTune_artefacts/Release/VST3/
