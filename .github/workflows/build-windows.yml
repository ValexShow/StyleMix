name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target StyleMix_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: StyleMix-VST3-Windows
          path: build/StyleMix_artefacts/Release/VST3/
